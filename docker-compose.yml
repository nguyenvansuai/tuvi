services:
  tuvi:
    build:
      context: .
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://tuvi.suai.vn}
    image: tuvi-suai:latest
    container_name: tuvi
    restart: unless-stopped
    env_file: .env
    ports:
      - "127.0.0.1:${APP_PORT:-3020}:3000"
    mem_limit: 512m
